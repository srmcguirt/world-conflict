[advisories]
# cargo-deny's v2 format: vulnerabilities are always denied; unmaintained
# crates are checked across every dependency (the v1 "warn" is gone).
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Dependencies only: gdext is MPL-2.0. Every allowed license lets the game be
# sold. If Azgaar algorithms are ever ported (design, The 50% head start),
# their MIT notice goes in a NOTICE file.
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
]
confidence-threshold = 0.9
# This workspace's own crates (publish = false) carry the project's
# noncommercial license; allowing it here would also let a noncommercial
# dependency in, which would stop the game being sold.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between this workspace's own unpublished crates.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/godot-rust/godot4-prebuilt"]
