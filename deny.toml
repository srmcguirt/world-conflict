[advisories]
# cargo-deny's v2 format: vulnerabilities are always denied; unmaintained
# crates are checked across every dependency (the v1 "warn" is gone).
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# gdext is MPL-2.0; Azgaar-derived code is MIT (attribution noted in NOTICE).
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between this workspace's own unpublished crates.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/godot-rust/godot4-prebuilt"]
