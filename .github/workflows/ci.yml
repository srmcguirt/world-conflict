name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Test sim-core (headless, no Godot)
        run: cargo test -p sim-core
      - name: Benchmark gate compiles (Milestone 1: 100 years/s)
        run: cargo bench -p sim-core --bench tick --no-run
      - name: Tick-length guard (D24: 1 tick = 1 sim-year)
        run: |
          if grep -rniE "ticks_per_year|TICKS_PER_YEAR|tick_length|YEARS_PER_TICK" sim-core/src sim-gd/src; then
            echo "::error::tick-length constants are forbidden (D24)"
            exit 1
          fi

  deny:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories licenses bans

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gdscript:
    name: GDScript (gdlint, gdformat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gdtoolkit 4.x
        run: pip install "gdtoolkit>=4,<5"
      - name: gdlint
        run: gdlint godot/
      - name: gdformat --check
        run: gdformat --check godot/
