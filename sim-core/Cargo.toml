[package]
name = "sim-core"
description = "World Conflict simulation core. No Godot dependency: headless cargo test and cargo bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Determinism contract: transcendental math goes through libm, not platform intrinsics.
libm = "0.2"
# Seeded RNG: one independent stream per system, derived from the world seed.
rand = { version = "0.9", default-features = false, features = ["std"] }
# Building catalog and invention graph are data files (design, Data not code).
ron = "0.8"
serde = { version = "1", features = ["derive"] }
rand_pcg = { version = "0.9", features = ["serde"] }
# Save files (design, Snapshot contents): compact binary serde, so a snapshot
# keeps every float bit-exact and autosave doesn't stall a frame.
postcard = { version = "1", default-features = false, features = ["use-std"] }

[dev-dependencies]
# Benchmark gate only: never linked into the shipped dylib.
criterion = "0.5"

[[bench]]
name = "tick"
harness = false

[lints]
workspace = true
