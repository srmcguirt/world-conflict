[workspace]
resolver = "2"
members = ["sim-core", "sim-gd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# gdext 0.5.5 requires Rust 1.94+.
rust-version = "1.94"
license = "MIT"
# A game, never a crates.io library; also lets cargo-deny accept the
# workspace path dependency (deny.toml allow-wildcard-paths).
publish = false

[workspace.dependencies]
# Pinned to the api level of the installed engine: Godot 4.7.2 + gdext 0.5.5
# (design Open Question 5: pin the gdext version that matches Godot).
godot = { version = "0.5.5", features = ["api-4-7"] }
sim-core = { path = "sim-core" }

[profile.dev]
# gdext recommendation: keep file:line info for backtraces, drop type debug info.
debug = "line-tables-only"

# Godot loads target/debug/libsim_gd.dylib when the game runs from the editor
# or `godot --path`, and an unoptimized sim ran 100 years in 5.2 s, so 100x
# speed could never keep up. Optimizing only the sim crate keeps debug builds
# of the godot bindings fast to compile and keeps overflow checks on.
[profile.dev.package.sim-core]
opt-level = 3

[profile.release]
# R12: sim-gd wraps every entry point in catch_unwind, so panics must unwind.
panic = "unwind"

# Quality gate (see AGENTS.md). Every crate opts in with `[lints] workspace = true`.
# A lint is silenced only with `#[expect(..., reason = "...")]` at the narrowest
# scope; `#[allow]` is denied outright so suppressions can't go stale.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight a tile-grid simulation: indices and float math
# cross between usize, i32 and f32 on every line.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
# Every pure function would need it; the noise would teach agents to ignore lints.
must_use_candidate = "allow"
# Restriction lints: the usual shapes of agent slop.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
float_cmp = "deny"
lossy_float_literal = "deny"
redundant_clone = "warn"
needless_pass_by_value = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
large_types_passed_by_value = "warn"
undocumented_unsafe_blocks = "deny"

# Used by cargo-mutants (.cargo/mutants.toml): release speed, quicker to build.
[profile.mutants]
inherits = "release"
debug = "none"
incremental = true
